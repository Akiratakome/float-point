# Lecoanet et al. (2016) smooth unstratified Kelvin--Helmholtz initial condition.
# Exact IC: rho=1, p=10, u_flow=1, A=0.01, a=0.05, sigma=0.2,
# y1=0.5, y2=1.5 on [0,1]x[0,2], with gamma=5/3 and periodic boundaries.
# B=0, so ideal MHD reduces to inviscid hydrodynamics. This cfg supports an
# early linear-growth reproduction only; it does not reproduce the paper's
# nonlinear Re=1e5 viscous/thermal/dye reference solution.
test    = kelvin_helmholtz_lecoanet
nx = 512
ny = 1024
xmin    = 0.0
xmax    = 1.0
ymin    = 0.0
ymax    = 2.0
gamma   = 1.6666666666666667
cfl     = 0.4
t_end = 0.25
glm_cr  = 0.18
bc      = periodic
bc_y    = periodic
riemann = hll
output_format = binary
output_file = C:/Users/tangy/Desktop/floatpoint/experiments/week21/lecoanet_kh_resolution_ladder/nx512/runs/t025/grid.bin
