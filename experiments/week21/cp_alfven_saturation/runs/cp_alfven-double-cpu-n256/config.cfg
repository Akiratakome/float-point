# Circularly polarised Alfven wave (Toth 2000; Gardiner & Stone 2005).
# Exact nonlinear solution: rho=1, p=0.1, Bx=1, B_perp = A(sin 2pi x, cos 2pi x)
# with A=0.1 and v_perp = -B_perp/sqrt(rho). The Alfven speed is 1, so on the
# unit periodic domain the exact state at t=1 is the initial condition itself.
# The final-minus-analytic difference is therefore true discretisation error,
# which makes this the order-verification case the discontinuous benchmarks
# cannot provide. nx is overridden per rung by the convergence driver.
test    = cp_alfven
nx = 256
xmin    = 0.0
xmax    = 1.0
gamma   = 1.6666666666666667
cfl     = 0.4
t_end   = 1.0
bc      = periodic
glm_cr  = 0.18
device = cpu
riemann = hll
output_format = binary
output_file = C:/Users/tangy/Desktop/floatpoint/experiments/week21/cp_alfven_saturation/runs/cp_alfven-double-cpu-n256/grid.bin
