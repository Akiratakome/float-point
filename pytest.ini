[pytest]
testpaths = tests/py
# The default basetemp under %TEMP% has repeatedly become unreadable on this
# workstation (WinError 5), which turns every tmp_path test into a setup error.
# Pinning it inside the repository makes `pytest tests/py` work from a fresh
# clone regardless of local temp-directory state. Override with --basetemp.
addopts = --basetemp=.pytest_tmp
